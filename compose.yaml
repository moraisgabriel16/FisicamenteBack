services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fisicamente
      POSTGRES_USER: fisicamente
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fisicamente"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://fisicamente:${POSTGRES_PASSWORD}@db/fisicamente
      APP_URL: ${APP_URL:-http://127.0.0.1:5186}
      APP_ENV: ${APP_ENV:-development}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Defina ENCRYPTION_KEY no .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - attachments:/app/backend/data
    depends_on:
      db:
        condition: service_healthy
  web:
    profiles: [full]
    build:
      context: ../Fisicamente
    ports:
      - "127.0.0.1:5186:80"
    depends_on:
      - api
volumes:
  postgres:
  attachments:
